{% extends 'base.html' %}
{% block content %}
<div style="max-width: 400px; margin: 50px auto; background: #1A202C; border: 1px solid #39FF14; padding: 40px; text-align: center;">
    <h2 style="color: #39FF14; text-transform: uppercase; margin-bottom: 30px;">Upload New Mod</h2>
    
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div style="margin-bottom: 20px; padding: 10px; border: 1px solid {% if category == 'error' %}#FC8181{% else %}#39FF14{% endif %}; color: {% if category == 'error' %}#FC8181{% else %}#39FF14{% endif %};">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST">
        <input type="text" name="title" placeholder="Mod Title (e.g. Bloodbath Texture Pack)" required style="width: 90%; padding: 15px; margin-bottom: 15px; background: #0F131A; border: 1px solid #2D3748; color: white; font-size: 1.1em; outline: none;">
        
        <input type="text" name="creator" placeholder="Creator Name" required style="width: 90%; padding: 15px; margin-bottom: 15px; background: #0F131A; border: 1px solid #2D3748; color: white; font-size: 1.1em; outline: none;">
        
        <textarea name="description" placeholder="Description: What does this mod do?" required style="width: 90%; padding: 15px; margin-bottom: 25px; background: #0F131A; border: 1px solid #2D3748; color: white; font-size: 1.1em; outline: none; height: 100px; resize: vertical; font-family: inherit;"></textarea>
        
        <button type="submit" style="width: 100%; padding: 15px; background: #39FF14; color: #1A202C; border: none; font-weight: bold; font-size: 1.2em; cursor: pointer; text-transform: uppercase; margin-bottom: 20px;">Publish Mod</button>
    </form>
    
    <a href="/" style="color: #A0AEC0; text-decoration: none; font-size: 0.9em;">Cancel and go back</a>
</div>
{% endblock %}
